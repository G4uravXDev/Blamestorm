<aside id="zitSidebar" class="zit-sidebar collapsed">

      <span class="sidebar-link-text">Dashboard</span>
    </a>
    <a href="{% url 'zit:staging' %}" class="sidebar-link {% if active_view == 'staging' %}active{% endif %}" data-tooltip="Smart Staging (s)">

      <span class="sidebar-link-badge"><kbd>s</kbd></span>
    </a>
    <a href="{% url 'zit:commit' %}" class="sidebar-link {% if active_view == 'commit' %}active{% endif %}" data-tooltip="Guided Commit (c)">

      <span class="sidebar-link-text">Commit</span>
      <span class="sidebar-link-badge"><kbd>c</kbd></span>
    </a>
    <a href="{% url 'zit:branches' %}" class="sidebar-link {% if active_view == 'branches' %}active{% endif %}" data-tooltip="Branch Manager (b)">
      <span class="sidebar-link-icon">🌿</span>
      <span class="sidebar-link-text">Branches</span>
      <span class="sidebar-link-badge"><kbd>b</kbd></span>

      <span class="sidebar-link-badge"><kbd>A</kbd></span>

      <span class="sidebar-link-text">Settings</span>
    </a>

  <div style="padding:10px; border-top:1px solid var(--border-color); text-align:center;">
    <button class="sidebar-toggle-btn" style="width:100%;" onclick="toggleSidebar()" title="Toggle Sidebar">
      <span id="sidebarBottomToggleText" style="font-size:11px; white-space:nowrap;">◀ Collapse</span>
    </button>
  </div>
