<!-- Blamestorm Collapsible Vertical Sidebar (Only on non-dashboard pages) -->
<style>
/* Scoped vertical sidebar styles — refined modern developer palette */
.blamestorm-sidebar {
  position: fixed !important;
  top: 49px !important;
  left: 0 !important;
  bottom: 0 !important;
  width: 56px;
  background-color: #161b22;
  border-right: 1px solid #30363d;
  display: flex !important;
  flex-direction: column !important;
  z-index: 95;
  transition: width 0.22s cubic-bezier(0.4, 0, 0.2, 1);
  overflow-x: hidden;
  box-shadow: 2px 0 12px rgba(0, 0, 0, 0.35);
}

.blamestorm-sidebar.expanded {
  width: 220px !important;
}

.sidebar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 8px;
  border-bottom: 1px solid #30363d;
  min-height: 42px;
  box-sizing: border-box;
}

.sidebar-header-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: #6e7681;
  white-space: nowrap;
  display: none;
  padding-left: 6px;
}

.blamestorm-sidebar.expanded .sidebar-header-title {
  display: block;
}

.sidebar-toggle-btn {
  background: #1c2128;
  border: 1px solid #30363d;
  border-radius: 6px;
  color: #8b949e;
  cursor: pointer;
  padding: 4px 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  width: 36px;
  height: 28px;
  margin: 0 auto;
  transition: transform 0.12s cubic-bezier(0.2, 0, 0, 1),
              background-color 0.18s ease,
              border-color 0.18s ease;
}
.blamestorm-sidebar.expanded .sidebar-toggle-btn {
  margin: 0;
}
.sidebar-toggle-btn:hover {
  background: #262c36;
  color: #f0f6fc;
  border-color: #484f58;
  transform: translateY(-1px);
}
.sidebar-toggle-btn:active {
  transform: translateY(1px) scale(0.92) !important;
  filter: brightness(0.88);
}

.sidebar-menu {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 8px 4px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.sidebar-menu::-webkit-scrollbar {
  width: 5px;
}
.sidebar-menu::-webkit-scrollbar-track {
  background: transparent;
}
.sidebar-menu::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.2);
  border-radius: 9999px;
  transition: background-color 0.2s ease;
}
.sidebar-menu::-webkit-scrollbar-thumb:hover {
  background: #58a6ff;
}

.sidebar-item {
  display: flex !important;
  align-items: center;
  padding: 8px 6px;
  border-radius: 6px;
  color: #8b949e;
  text-decoration: none !important;
  font-size: 13px;
  font-weight: 500;
  transition: background-color 0.15s ease,
              color 0.15s ease,
              transform 0.15s cubic-bezier(0.4, 0, 0.2, 1);
  white-space: nowrap;
  position: relative;
  min-height: 38px;
  box-sizing: border-box;
}

.sidebar-item:hover {
  background-color: #262c36;
  color: #f0f6fc;
  transform: translateX(2px);
}

.sidebar-item:active {
  transform: scale(0.96) !important;
  filter: brightness(0.88);
}

.sidebar-item.active {
  background-color: rgba(56, 139, 253, 0.14);
  color: #58a6ff;
  font-weight: 600;
  box-shadow: inset 3px 0 0 #388bfd;
}

.sidebar-item-icon {
  font-size: 17px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  min-width: 38px;
  text-align: center;
  flex-shrink: 0;
}

.sidebar-item-label {
  margin-left: 8px;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  display: none;
}

.sidebar-item-badge {
  margin-left: auto;
  padding-right: 4px;
  display: none;
}

.blamestorm-sidebar.expanded .sidebar-item-label {
  display: block;
}
.blamestorm-sidebar.expanded .sidebar-item-badge {
  display: inline-block;
}

/* Floating Tooltip in collapsed mode */
.blamestorm-sidebar:not(.expanded) .sidebar-item:hover::after {
  content: attr(data-tooltip);
  position: absolute;
  left: 54px;
  top: 50%;
  transform: translateY(-50%);
  background: #21262d;
  color: #f0f6fc;
  border: 1px solid #484f58;
  border-radius: 6px;
  padding: 5px 10px;
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
  z-index: 99999;
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.55);
  pointer-events: none;
}

/* Push main content beside the fixed sidebar */
.zit-layout-with-sidebar .zit-main-area {
  margin-left: 56px;
  transition: margin-left 0.22s cubic-bezier(0.4, 0, 0.2, 1);
  min-width: 0;
  flex: 1;
  display: flex;
  flex-direction: column;
}

body.sidebar-expanded .zit-layout-with-sidebar .zit-main-area {
  margin-left: 220px;
}
</style>
