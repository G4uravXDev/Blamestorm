<header class="zit-navbar">
  <div class="nav-brand">
    <a href="{% url 'blame:dashboard' %}" class="nav-logo">
      <span style="color:#39c5cf;">&gt;</span>Blamestorm<span style="color:var(--accent-green-bright); font-size:12px;">.py</span>
    </a>
    <div class="nav-repo-info" onclick="openModal('repoModal')" title="Click to switch working repository">
      <span style="color:var(--accent-blue); display:inline-flex; align-items:center;">
        <svg class="zit-icon zit-icon-sm"><use href="#icon-folder"></use></svg>
      </span>
      <span class="font-mono" style="font-size:12px; max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
        {{ current_repo_path }}
      </span>
      {% if repo_status %}
        <span class="badge badge-branch">{{ repo_status.branch }}</span>
        {% if repo_status.is_clean %}
          <span class="badge badge-clean">clean</span>
        {% else %}
          <span class="badge badge-dirty">{{ repo_status.total_changed_files }} dirty</span>
        {% endif %}
      {% endif %}
    </div>
  </div>

  <div class="nav-actions">
    {% if active_view != 'dashboard' %}
      <a href="{% url 'blame:dashboard' %}" class="btn btn-sm" title="Return to Dashboard">
        <svg class="zit-icon zit-icon-sm" style="margin-right:4px;"><use href="#icon-home"></use></svg>Dashboard
      </a>
    {% endif %}
    <button class="btn btn-sm" onclick="openModal('shortcutsModal')" title="Keyboard Shortcuts (?)">
      <kbd>?</kbd> Help
    </button>
    <a href="{% url 'blame:settings' %}" class="btn btn-sm" title="Settings & Gemini Model" aria-label="Settings">
      <svg class="zit-icon zit-icon-sm"><use href="#icon-settings"></use></svg>
    </a>
  </div>
</header>
